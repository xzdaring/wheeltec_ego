goal_to_path:
  ros__parameters:
    current_pose_topic: /current_pose
    goal_topic: /goal_pose
    path_topic: /ego_global_path
    # RViz 的 Nav2 Goal 默认连接这个 action 名称。
    navigate_action: /navigate_to_pose
    target_frame: map

    # 相邻参考点约 30 cm；EGO 内部还会再次离散，初始阶段无需生成过密路径。
    path_spacing: 0.30

    # 零平移由规划器近终点分支处理，支持独立调整最终yaw。
    transform_timeout: 0.10

    # action 只有在位置和朝向同时进入容差时才返回成功。
    xy_goal_tolerance: 0.03
    yaw_goal_tolerance: 0.04

    # 到达容差与跟踪器一致，避免提前宣告成功而终点朝向尚未收敛。
